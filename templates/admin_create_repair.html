{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Створити нове замовлення на ремонт</h2>

    <form action="{{ url_for('admin_create_repair') }}" method="POST" class="mt-3">
        <div class="mb-3">
            <label for="user_id" class="form-label">Клиент:</label>
            <select name="user_id" id="user_id" class="form-select" required>
                <option value="" disabled selected>-- Виберіть клієнта --</option>
                {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }} (ID: {{ u.id }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="device_name" class="form-label">Пристрій:</label>
            <input type="text" name="device_name" id="device_name" class="form-control" placeholder="Например: iPhone 11 / Ноутбук Lenovo" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Опис проблеми / робіт:</label>
            <textarea name="description" id="description" class="form-control" rows="3" placeholder="Замена экрана, чистка и т.д."></textarea>
        </div>

        <button type="submit" class="btn btn-success">Зберегти замовлення</button>
        <a href="{{ url_for('admin_page') }}" class="btn btn-secondary">Відмина</a>
    </form>
</div>
{% endblock %}
